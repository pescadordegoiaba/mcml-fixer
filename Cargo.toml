[package]
name = "mcml-fixer"
version = "2.8.1"
edition = "2021"
description = "CLI + GUI para fazer My Car My Life (GameMaker 1.4) rodar em Linux moderno (libs legadas, resolucao nativa, cursor, UI do PC) e para instalar o mod Distribuidor + Carburador"
license = "MIT"
readme = "README.md"
repository = "https://github.com/pescadordegoiaba/mcml-fixer"
keywords = ["gamemaker", "linux", "compatibility", "modding", "egui"]
categories = ["command-line-utilities", "games"]

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["glow", "wayland", "x11"] }
egui = "0.28"
libc = "0.2"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
